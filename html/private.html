<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Private | Crux's Portfolio</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- ========================================
         SIDEBAR
    ======================================== -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-brand">
            <span>CRUX</span>
        </div>


        <nav class="sidebar-nav">

            <a
                href="./index.html#home"
                class="sidebar-link"
                data-section="home"
            >
                <span class="sidebar-icon">⌂</span>
                <span>Home</span>
            </a>


            <a
                href="./index.html#about"
                class="sidebar-link"
                data-section="about"
            >
                <span class="sidebar-icon">◎</span>
                <span>About</span>
            </a>


            <a
                href="./index.html#socials"
                class="sidebar-link"
                data-section="socials"
            >
                <span class="sidebar-icon">@</span>
                <span>Socials</span>
            </a>


            <!-- ========================================
                 PROGRAMS DROPDOWN
            ======================================== -->

            <div class="sidebar-dropdown">

                <button
                    type="button"
                    class="sidebar-link sidebar-dropdown-button"
                    id="programsButton"
                    aria-expanded="false"
                >

                    <span class="sidebar-icon">
                        ◇
                    </span>

                    <span>
                        Programs
                    </span>

                    <span
                        class="sidebar-dropdown-arrow"
                        id="programsArrow"
                    >
                        ›
                    </span>

                </button>


                <div
                    class="sidebar-dropdown-menu"
                    id="programsMenu"
                >

                    <a
                        href="./programs/1st-year/"
                        class="sidebar-sublink"
                    >
                        1st Year BSCpE
                    </a>

                    <a
                        href="./programs/2nd-year/"
                        class="sidebar-sublink"
                    >
                        2nd Year BSCpE
                    </a>

                    <a
                        href="./programs/3rd-year/"
                        class="sidebar-sublink"
                    >
                        3rd Year BSCpE
                    </a>

                    <a
                        href="./programs/4th-year/"
                        class="sidebar-sublink"
                    >
                        4th Year BSCpE
                    </a>

                </div>

            </div>


            <!-- ========================================
                 PRIVATE
            ======================================== -->

            <a
                href="./private.html"
                id="privateLink"
                class="sidebar-link"
                style="display: none;"
            >

                <span class="sidebar-icon">
                    ▣
                </span>

                <span>
                    Private
                </span>

            </a>

        </nav>


        <!-- ========================================
             SETTINGS
        ======================================== -->

        <div class="sidebar-bottom">

            <a
                href="./settings.html"
                class="sidebar-link"
            >

                <span class="sidebar-icon">
                    ⚙
                </span>

                <span>
                    Settings
                </span>

            </a>

        </div>

    </aside>


    <!-- ========================================
         MENU BUTTON
    ======================================== -->

    <button
        class="mobile-menu-button"
        id="mobileMenuButton"
        aria-label="Open navigation"
        aria-expanded="false"
    >
        ☰
    </button>


    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
    ></div>


    <!-- ========================================
         MAIN CONTENT
    ======================================== -->

    <main class="site-main">

        <section class="section">

            <div class="container">

                <div class="page-heading">

                    <p class="section-label">
                        PRIVATE
                    </p>

                    <h1>
                        Private
                    </h1>

                    <p class="section-description">
                        Private content and personal information.
                    </p>

                </div>


                <!--
                    Keep your existing private
                    content below this point.
                -->

                <div id="privateContent">

                </div>

            </div>

        </section>

    </main>


    <script
        type="module"
        src="../js/private.js"
    ></script>

</body>

</html>
