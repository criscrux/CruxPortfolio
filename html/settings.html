<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings | Crux's Portfolio</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- ========================================
         SHARED SIDEBAR
    ======================================== -->

    <div id="sidebar-container"></div>


    <!-- ========================================
         MAIN CONTENT
    ======================================== -->

    <main class="site-main">

        <section class="section settings-page">

            <div class="container">

                <div class="page-heading">

                    <p class="section-label">
                        SETTINGS
                    </p>

                    <h1>
                        Profile
                    </h1>

                    <p class="section-description">
                        Your account information.
                    </p>

                </div>


                <!-- ========================================
                     PROFILE CARD
                ======================================== -->

                <div class="settings-card">

                    <div class="profile-avatar-container">

                        <img
                            id="profileAvatarImage"
                            class="profile-avatar-image"
                            src=""
                            alt="Profile picture"
                        >

                        <div
                            class="profile-avatar"
                            id="profileAvatar"
                        >
                            ?
                        </div>

                    </div>


                    <div class="profile-info">

                        <!-- NAME -->

                        <div class="profile-item">

                            <span class="profile-label">
                                Name
                            </span>

                            <span
                                class="profile-value"
                                id="profileUsername"
                            >
                                Loading...
                            </span>

                        </div>


                        <!-- EMAIL -->

                        <div class="profile-item">

                            <span class="profile-label">
                                Email
                            </span>

                            <span
                                class="profile-value"
                                id="profileEmail"
                            >
                                Loading...
                            </span>

                        </div>


                        <!-- ROLE -->

                        <div class="profile-item">

                            <span class="profile-label">
                                Role
                            </span>

                            <span
                                class="profile-value role-badge"
                                id="profileRole"
                            >
                                Loading...
                            </span>

                        </div>

                    </div>

                </div>


                <!-- ========================================
                     SETTINGS ACTIONS
                ======================================== -->

                <div class="settings-actions">

                    <button
                        type="button"
                        class="danger-button"
                        id="logoutButton"
                    >
                        Log out
                    </button>

                </div>

            </div>

        </section>

    </main>


    <!-- ========================================
         SCRIPTS
    ======================================== -->

    <script type="module" src="../js/sidebar.js"></script>
    <script type="module" src="../js/settings.js"></script>

</body>

</html>
