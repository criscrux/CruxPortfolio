<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Our First Year</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600;1,9..144,700&family=Nunito:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/cake.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div id="sidebar-container"></div>
    <div class="bg" aria-hidden="true"></div>
    <div class="stars" aria-hidden="true"></div>
    <div class="floaters" aria-hidden="true">
        <i class="fh" style="--l:6%;--s:14px;--d:17s;--dl:-2s;--dx:30px;--hc:#c084fc"></i>
        <i class="fh" style="--l:16%;--s:10px;--d:21s;--dl:-9s;--dx:-24px;--hc:#f0abfc"></i>
        <i class="fh" style="--l:27%;--s:18px;--d:19s;--dl:-5s;--dx:40px;--hc:#a78bfa"></i>
        <i class="fh" style="--l:38%;--s:11px;--d:23s;--dl:-13s;--dx:-30px;--hc:#f472b6"></i>
        <i class="fh" style="--l:49%;--s:15px;--d:18s;--dl:-7s;--dx:26px;--hc:#c4b5fd"></i>
        <i class="fh" style="--l:60%;--s:12px;--d:22s;--dl:-16s;--dx:-36px;--hc:#e879f9"></i>
        <i class="fh" style="--l:71%;--s:20px;--d:20s;--dl:-3s;--dx:34px;--hc:#a78bfa"></i>
        <i class="fh" style="--l:82%;--s:10px;--d:24s;--dl:-11s;--dx:-22px;--hc:#f9a8d4"></i>
        <i class="fh" style="--l:90%;--s:16px;--d:16s;--dl:-6s;--dx:-30px;--hc:#c084fc"></i>
        <i class="fh" style="--l:94%;--s:12px;--d:25s;--dl:-18s;--dx:20px;--hc:#f0abfc"></i>
    </div>

    <main class="page">
        <header class="head">
            <div class="msg pre" id="msgPre">
                <p class="eyebrow">One year together</p>
                <h1>Make a wish</h1>
                <p class="sub">Twelve months with you, and I would still wish for more.</p>
            </div>
            <div class="msg post" id="msgPost" aria-hidden="true">
                <p class="eyebrow">Our first year</p>
                <h1 id="postTitle">Happy 1st Anniversary</h1>
                <p class="sub">One year of you and me. Here's to every candle we'll blow out together.</p>
            </div>
        </header>

        <section class="cake" aria-label="A three-tier purple anniversary cake with one lit candle">
            <div class="shade"></div>

            <div class="candle" id="candle">
                <div class="hit"></div>
                <div class="wax"></div>
                <div class="wick"></div>
                <div class="fire" id="fire">
                    <div class="flame-wrap">
                        <div class="glow"></div>
                        <div class="lean" id="lean">
                            <div class="flame"></div>
                        </div>
                    </div>
                    <div class="smoke">
                        <i style="--dx:.9em"></i>
                        <i style="--dx:-.7em"></i>
                        <i style="--dx:.4em"></i>
                    </div>
                </div>
            </div>

            <div class="tier t1">
                <div class="top"></div>
                <div class="side">
                    <i class="heart" style="left:32%;top:4.9em;font-size:.8em;--hc:#fff"></i>
                    <i class="heart" style="left:47.5%;top:5.3em;font-size:.95em;--hc:#f9a8d4"></i>
                    <i class="heart" style="left:63%;top:4.9em;font-size:.8em;--hc:#fff"></i>
                </div>
                <i class="heart" style="left:12%;top:.65em;font-size:.8em;--hc:#f472b6"></i>
                <i class="heart" style="right:12%;top:.65em;font-size:.8em;--hc:#f472b6"></i>
            </div>

            <div class="tier t2">
                <div class="top"></div>
                <div class="side"><span class="numeral">1</span></div>
                <i class="berry" style="--x:5%"></i>
                <i class="berry" style="--x:11%"></i>
                <i class="heart" style="left:15%;top:.7em;font-size:.7em;--hc:#f472b6"></i>
                <i class="heart" style="right:15%;top:.7em;font-size:.7em;--hc:#f472b6"></i>
                <i class="berry" style="--x:84%"></i>
                <i class="berry" style="--x:90%"></i>
            </div>

            <div class="tier t3">
                <div class="top"></div>
                <div class="side"></div>
                <i class="berry" style="--x:4%"></i>
                <i class="berry" style="--x:9.5%"></i>
                <i class="berry" style="--x:15%"></i>
                <i class="heart" style="left:20%;top:.7em;font-size:.7em;--hc:#f472b6"></i>
                <i class="heart" style="right:20%;top:.7em;font-size:.7em;--hc:#f472b6"></i>
                <i class="berry" style="--x:80.5%"></i>
                <i class="berry" style="--x:86%"></i>
                <i class="berry" style="--x:91.5%"></i>
            </div>

            <div class="plate"></div>
            <div class="stem"></div>
            <div class="foot"></div>
        </section>

        <footer class="ui">
            <p class="note" id="note" role="status" aria-live="polite"></p>
            <button class="btn" id="btnMic" type="button">Happy Anniversary</button>
            <div class="meter" id="meterRow" hidden>
                <div class="bar" aria-hidden="true"><i id="bar"></i></div>
                <label class="sens">Mic sensitivity
                    <input id="sens" type="range" min="10" max="100" value="60">
                </label>
            </div>
            <button class="btn" id="btnAgain" type="button" hidden>Light it again</button>
            <button class="link sr-only" id="btnTap" type="button">Tap to blow it out instead</button>
            <a class="page-nav-button cake-back-button" href="./danie.html?page=5">
                <span>←</span>
                <span>Back</span>
            </a>
        </footer>
    </main>

    <canvas id="confetti" aria-hidden="true"
        style="position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none"></canvas>

    <script type="module" src="../js/cake.js"></script>
    <script type="module" src="../js/sidebar.js"></script>
</body>

</html>
