<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Crux's Portfolio</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="login-page">

        <div class="login-box">

            <div class="login-brand">
                CRUX
            </div>

            <p class="section-label">
                PORTFOLIO
            </p>

            <h1>
                Welcome Back
            </h1>

            <p class="login-description">
                Sign in to continue to Crux's Portfolio.
            </p>

            <button
                type="button"
                id="googleLogin"
                class="google-login-button"
            >
                <span class="google-icon">G</span>
                <span>Continue with Google</span>
            </button>

            <p
                id="loginMessage"
                class="login-message"
            ></p>

            <a
                href="./index.html"
                class="login-back"
            >
                ← Back to Home
            </a>

        </div>

    </main>

    <script
        type="module"
        src="../js/login.js"
    ></script>

</body>

</html>
