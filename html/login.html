
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Crux's Portfolio</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- ========================================
         LOGIN PAGE
    ======================================== -->

    <main class="login-page">

        <div class="login-box">

            <div class="login-brand">
                CRUX
            </div>

            <p class="section-label">
                PORTFOLIO
            </p>

            <h1>
                Welcome Back
            </h1>

            <p class="login-description">
                Sign in to continue to Crux's Portfolio.
            </p>


            <!-- GOOGLE LOGIN -->

            <button
                type="button"
                id="googleLogin"
                class="google-login-button"
            >

                <span class="google-icon">
                    G
                </span>

                <span>
                    Continue with Google
                </span>

            </button>


            <!-- LOGIN MESSAGE -->

            <p
                id="loginMessage"
                class="login-message"
            ></p>


            <!-- BACK TO HOME -->

            <a
                href="./index.html"
                class="login-back"
            >
                ← Back to Home
            </a>

        </div>

    </main>


    <!-- ========================================
         LOGIN SCRIPT
    ======================================== -->

    <script type="module" src="../js/login.js"></script>

</body>

</html>
