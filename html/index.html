<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crux's Portfolio</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- ========================================
         SIDEBAR
    ======================================== -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-brand">
            <span>CRUX</span>
        </div>

        <nav class="sidebar-nav">

            <a
                href="#home"
                class="sidebar-link active"
                data-section="home"
            >
                <span class="sidebar-icon">⌂</span>
                <span>Home</span>
            </a>

            <a
                href="#about"
                class="sidebar-link"
                data-section="about"
            >
                <span class="sidebar-icon">◎</span>
                <span>About</span>
            </a>

            <a
                href="./programs.html"
                id="programsLink"
                class="sidebar-link"
                style="display: none;"
            >
                <span class="sidebar-icon">◇</span>
                <span>Programs</span>
            </a>

            <a
                href="./private.html"
                id="privateLink"
                class="sidebar-link"
                style="display: none;"
            >
                <span class="sidebar-icon">▣</span>
                <span>Private</span>
            </a>

        </nav>


        <div class="sidebar-bottom">

            <a
                href="./settings.html"
                class="sidebar-link"
            >
                <span class="sidebar-icon">⚙</span>
                <span>Settings</span>
            </a>

        </div>

    </aside>


    <!-- ========================================
         MENU BUTTON
    ======================================== -->

    <button
        class="mobile-menu-button"
        id="mobileMenuButton"
        aria-label="Open navigation"
        aria-expanded="false"
    >
        ☰
    </button>


    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
    ></div>


    <!-- ========================================
         MAIN CONTENT
    ======================================== -->

    <main class="site-main">


        <!-- ========================================
             HOME
        ======================================== -->

        <section
            class="hero"
            id="home"
        >

            <div class="container">

                <div class="brand-title">
                    CRUX
                </div>

                <div class="hero-line"></div>

                <p class="hero-label">
                    PERSONAL PORTFOLIO
                </p>

                <h1>
                    Welcome to my portfolio
                </h1>

                <p class="hero-description">
                    A collection of my projects, programs,
                    photography, and personal work.
                </p>


                <!--
                    Login button only appears
                    when the visitor is not logged in.
                -->

                <a
                    href="./login.html"
                    class="primary-button"
                    id="loginButton"
                >
                    Login
                </a>

            </div>

        </section>


        <!-- ========================================
             ABOUT
        ======================================== -->

        <section
            class="about section"
            id="about"
        >

            <div class="container">

                <p class="section-label">
                    ABOUT
                </p>

                <h2>
                    About Me
                </h2>

                <p class="section-description">
                    Welcome to my personal website.
                    More information about me will be added here.
                </p>

            </div>

        </section>


    </main>


    <script
        type="module"
        src="../js/script.js"
    ></script>

</body>

</html>
